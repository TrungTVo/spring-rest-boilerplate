# yaml-language-server: $schema=https://www.schemastore.org/any.json
spring:
  application:
    name: spring-rest-boilerplate
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: trung
    password: password
  jpa:
    open-in-view: false
    show-sql: true                    # logs generated SQL

management:
  endpoints:
    web:
      exposure:
        include: '*'
