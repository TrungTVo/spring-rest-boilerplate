# yaml-language-server: $schema=https://www.schemastore.org/any.json
spring:
  application:
    name: spring-rest-boilerplate
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/myappdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: appuser
    password: appuserpassword123
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update # Use 'update' for development, 'validate' or 'none' for production
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: '*'
