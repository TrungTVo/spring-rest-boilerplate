services:
  mysql:
    image: mysql:latest
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123 # Change this!
      MYSQL_DATABASE: myappdb # Optional: creates a database on startup
      MYSQL_USER: appuser # Optional: creates a non-root user
      MYSQL_PASSWORD: appuserpassword123 # Change this!
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # Persistent data
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-server:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: redis-server
    hostname: redis-server
    restart: always
    ports:
      - 6379:6379
    networks:
      - default

  redisinsight:
    image: redis/redisinsight:3.2
    container_name: redisinsight
    hostname: redisinsight
    ports:
      - 5540:5540
    networks:
      - default
    volumes:
      - redisinsight-data:/data    

volumes:
  mysql-data:
    driver: local
  redisinsight-data:
    driver: local

networks:
  default: {}
